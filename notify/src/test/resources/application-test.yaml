management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

resilience4j:
  circuitbreaker:
    enabled: false
  retry:
    enabled: false
    instances: {}
  bulkhead:
    enabled: false
  ratelimiter:
    enabled: false
  timelimiter:
    enabled: false

application:
  name-short: notify-api
  name: Notify API
  description: Notification service responsible for email delivery and user notification processing.
  version: 1.0.0
  environment: local
  timezone: America/Sao_Paulo
  default-language: en-US

spring:
  task:
    scheduling:
      enabled: false
  application:
    name: notify-api
  swagger-ui:
    customCssUrl: /swagger-ui/custom.css
  threads:
    virtual:
      enabled: true

  sql:
    init:
      mode: always

  datasource:
    url: jdbc:mysql://localhost:3306/notify_db_test
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      group-id: url-shortener-notify-group
      auto-offset-reset: earliest
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

logging:
  level:
    root: INFO
    org.springframework.jdbc.core: DEBUG
    com.notify.notify: DEBUG
  file:
    name: /var/log/spring/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      total-size-cap: 100MB
      max-history: 7
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%X{traceId:-},%X{spanId:-}]){yellow} %clr(%-5level) %clr(%logger{36}){cyan} %clr(:-){faint} %msg%n"
    file: "{\"timestamp\":\"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}\",\"traceId\":\"%X{traceId:-}\",\"spanId\":\"%X{spanId:-}\",\"level\":\"%level\",\"logger\":\"%logger\",\"message\":\"%replace(%msg){'\"', '\\\"'}%ex{full}\"}%n"