management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  tracing:
    sampling:
      probability: 1.0
  metrics:
    distribution:
      percentiles-histogram:
        "http.server.requests": true
        "cache.gets": true
        "resilience4j.circuitbreaker": true
      percentiles:
        "http.server.requests": 0.50, 0.90, 0.95, 0.99
    tags:
      application: ${spring.application.name}

application:
  name-short: notify-api
  name: Notify API
  description: Notification service responsible for email delivery and user notification processing.
  version: 1.0.0
  environment: local
  timezone: America/Sao_Paulo
  default-language: en-US

spring:
  application:
    name: notify-api
  datasource:
    url: jdbc:mysql://tidb-server:4000/url_shortener_notify?cachePrepStmts=true&prepStmtCacheSize=500&prepStmtCacheSqlLimit=4096&useServerPrepStmts=true&rewriteBatchedStatements=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: UrlShortenerNotifyPool
      maximum-pool-size: 40
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  swagger-ui:
    customCssUrl: /swagger-ui/custom.css
  data:
    redis:
      host: dragonfly
      port: 6379
      timeout: 2s
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: redpanda:9092
    consumer:
      group-id: url-shortener-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

resilience4j:
  retry:
    instances:
      insert:
        max-attempts: 4
        wait-duration: 150ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.dao.TransientDataAccessException
          - org.springframework.dao.DataAccessResourceFailureException
          - com.mongodb.MongoSocketException
          - com.mongodb.MongoTimeoutException
        ignore-exceptions:
          - org.springframework.dao.DuplicateKeyException
          - org.springframework.dao.DataIntegrityViolationException
          - java.lang.IllegalArgumentException
      save:
        max-attempts: 4
        wait-duration: 150ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.dao.TransientDataAccessException
          - org.springframework.dao.DataAccessResourceFailureException
          - com.mongodb.MongoSocketException
          - com.mongodb.MongoTimeoutException
        ignore-exceptions:
          - org.springframework.dao.OptimisticLockingFailureException
          - java.lang.IllegalArgumentException
      delete:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.dao.TransientDataAccessException
          - org.springframework.dao.DataAccessResourceFailureException
          - com.mongodb.MongoSocketException
          - com.mongodb.MongoTimeoutException
        ignore-exceptions:
          - org.springframework.dao.EmptyResultDataAccessException
          - java.lang.IllegalArgumentException
      read:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.dao.TransientDataAccessException
          - org.springframework.dao.DataAccessResourceFailureException
          - com.mongodb.MongoSocketException
          - com.mongodb.MongoTimeoutException
        ignore-exceptions:
          - java.lang.IllegalArgumentException

      scheduler:
        max-attempts: 3
        wait-duration: 2s

      cdc-action:
        max-attempts: 5
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2

      redis:
        max-attempts: 4
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.data.redis.RedisConnectionFailureException
          - io.lettuce.core.RedisException
      database:
        max-attempts: 4
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 3
        retry-exceptions:
          - com.read.api.domain.exceptions.TransientDatabaseException
        ignore-exceptions:
          - org.springframework.dao.DataIntegrityViolationException
          - java.lang.IllegalStateException
          -
      kafka:
        timeout-duration: 5s
        max-attempts: 4
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 4
        retry-exceptions:
          - org.apache.kafka.common.errors.RetriableException
          - org.springframework.kafka.KafkaException
      kafka-producer:
        max-attempts: 5
        wait-duration: 250ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.kafka.KafkaException
          - org.apache.kafka.common.errors.TimeoutException
          - org.apache.kafka.common.errors.NetworkException
      kafka-consumer:
        max-attempts: 4
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 3

      http:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.net.SocketTimeoutException
          - java.net.ConnectException
          - org.springframework.web.client.ResourceAccessException

  circuitbreaker:
    instances:
      kafka:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true

  bulkhead:
    instances:
      kafka:
        max-concurrent-calls: 10
        max-wait-duration: 0
      outbox:
        max-concurrent-calls: 2
        max-wait-duration: 0

  timelimiter:
    instances:
      kafka:
        timeout-duration: 2s

  ratelimiter:
    instances:
      read-low:
        limit-for-period: 100
        limit-refresh-period: 4s
        timeout-duration: 0
      read-middle:
        limit-for-period: 120
        limit-refresh-period: 3s
        timeout-duration: 0
      read-strong:
        limit-for-period: 180
        limit-refresh-period: 2s
        timeout-duration: 0

logging:
  file:
    name: /var/log/spring/app.log

  logback:
    rollingpolicy:
      max-file-size: 10MB
      total-size-cap: 100MB
      max-history: 7

  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%X{traceId:-},%X{spanId:-}]){yellow} %clr(%-5level) %clr(%logger{36}){cyan} %clr(:-){faint} %msg%n"
    file: "{\"timestamp\":\"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}\",\"traceId\":\"%X{traceId:-}\",\"spanId\":\"%X{spanId:-}\",\"level\":\"%level\",\"logger\":\"%logger\",\"message\":\"%replace(%msg){'\"', '\\\"'}%ex{full}\"}%n"